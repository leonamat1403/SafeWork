# Migrações do banco (Alembic). Uso, na pasta do projeto:
#   alembic upgrade head                               # cria/atualiza as tabelas (o sistema também faz isso ao iniciar)
#   alembic revision --autogenerate -m "descrição"     # depois de mudar app/models.py: gera uma nova migração
# O endereço do banco vem do .env (DATABASE_URL); veja alembic/env.py.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
output_encoding = utf-8
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Vazio de propósito: alembic/env.py usa a DATABASE_URL do .env
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
