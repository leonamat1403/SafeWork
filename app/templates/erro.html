{% extends "base.html" %}
{# Tela de erro genérica (404, 403 etc.): recebe `titulo` e `mensagem` do servidor. Não usa JavaScript próprio. #}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="cartao">
  <h1 class="titulo-pagina mb-2">{{ titulo }}</h1>
  <p>{{ mensagem }}</p>
  <a href="/ao-vivo" class="btn btn-primary">Ir para Ao vivo</a>
</div>
{% endblock %}
